name: Build & publish image (linux/amd64)

# Builds the moss-batch image on GitHub's runners and pushes it to GHCR, so no
# local Docker install is needed. The image bakes in ~15.4 GB of weights, so this
# is a long build (~25-45 min) — budget accordingly.
#
# Auth uses the automatic GITHUB_TOKEN. No Docker Hub account, no repo secrets.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "moss_batch.py"
      - "workflow.json"
      - "prompts.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Create the SaladCloud container group after the push"
        type: boolean
        default: false
      batch_size:
        description: "BATCH_SIZE for the Salad group"
        type: string
        default: "4"

env:
  # Bump only if a build breaks; pinning keeps runs comparable.
  BUILDKIT_PROGRESS: plain
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: build + push
    runs-on: ubuntu-latest
    timeout-minutes: 150

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A stock runner has ~25-29 GB free. The build needs 15.4 GB of weights
      # plus image layers plus build cache, so free the junk first or you get
      # "no space left on device" around the text-encoder layer.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Report free space
        run: df -h / /mnt

      # ghcr.io requires a lowercase repository path. github.repository is
      # "Iteranya/moss-batch" — the capital I makes `docker push` fail with
      # "invalid reference format", so normalise it here.
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations add manifest blobs beside a 15 GB image and make the
          # push slower for zero benefit on a batch container.
          provenance: false
          sbom: false
          # No cache: a 15 GB layer exceeds the 10 GB GHA cache budget and
          # thrashes it instead of helping. Revisit with type=registry later.

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pull it in Salad as \`${{ env.IMAGE_NAME }}:latest\`."
            echo ""
            echo "**Make the package public** (Packages → moss-batch → Settings →"
            echo "Change visibility) or Salad cannot pull it without registry credentials."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: create Salad container group
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reuses the repo's own deploy_salad.sh so the resource numbers live in
      # one place. Secrets required: SALAD_API_KEY, SALAD_ORG, SALAD_PROJECT.
      - name: Deploy
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          SALAD_ORG: ${{ secrets.SALAD_ORG }}
          SALAD_PROJECT: ${{ secrets.SALAD_PROJECT }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
          BATCH_SIZE: ${{ inputs.batch_size }}
          SALAD_GROUP: moss-batch
          PRIORITY: medium
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          chmod +x ./deploy_salad.sh
          ./deploy_salad.sh
